[pytest]
pythonpath = .

testpaths = tests

addopts =
    -v
    --tb=short
    --strict-markers
    --strict-config
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml

asyncio_mode = auto

markers =
    unit: fast unit tests, no DB / external services
    integration: integration tests against a real PostgreSQL test DB
    e2e: end-to-end flows exercising multiple layers
    slow: tests that are slow (>1s) — skip with `-m "not slow"`

filterwarnings =
    ignore::DeprecationWarning:passlib.*
    ignore::DeprecationWarning:pkg_resources.*

minversion = 7.4