<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - ComfyGo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
        <div class="card shadow" style="width: 400px;">
            <div class="card-body p-5">
                <h3 class="text-center mb-4">Register Admin</h3>
                <div id="alert-box" class="alert alert-danger d-none" role="alert"></div>
                <form id="register-form">
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" class="form-control" id="admin_name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="admin_email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" id="admin_password" required>
                        <small class="text-muted">Min 8 chars, 1 uppercase, 1 digit.</small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Phone</label>
                        <input type="text" class="form-control" id="admin_phone">
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Register</button>
                    </div>
                    <div class="text-center mt-3">
                        <a href="login.html">Already have an account? Login</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/utils/storage.js"></script>
    <script src="js/api/client.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById('alert-box');
            const data = {
                admin_name: document.getElementById('admin_name').value,
                admin_email: document.getElementById('admin_email').value,
                admin_password: document.getElementById('admin_password').value,
                admin_phone: document.getElementById('admin_phone').value
            };

            try {
                await apiClient.post('/auth/register/admin', data);
                const res = await apiClient.post('/auth/login/admin', {
                    admin_email: data.admin_email,
                    admin_password: data.admin_password
                });
                Storage.setToken(res.access_token);
                Storage.setRole(res.role);
                window.location.href = 'dashboard.html';
            } catch (error) {
                alertBox.classList.remove('d-none');
                alertBox.innerText = error.message;
            }
        });
    </script>
</body>
</html>
