<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Destination · ComfyGo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .detail-hero{position:relative;height:55vh;min-height:400px;overflow:hidden;margin-top:60px;background:var(--sage);display:flex;align-items:flex-end}
    .detail-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .detail-hero::after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(16,44,39,.85))}
    .detail-hero-content{position:relative;z-index:2;padding:40px 0;width:100%}
    .detail-hero-content .shell{max-width:1000px}
    .detail-hero .detail-category{display:inline-block;padding:5px 14px;border-radius:999px;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px;color:#fff}
    .detail-hero h1{font-family:'Playfair Display',serif;font-size:2.8rem;color:#fff;margin:0 0 10px;line-height:1.15}
    .detail-hero .hero-meta{display:flex;flex-wrap:wrap;gap:16px;color:rgba(255,255,255,.85);font-size:.92rem}
    .detail-hero .hero-meta span{display:flex;align-items:center;gap:5px}
    .detail-body{max-width:1000px;margin:0 auto;padding:40px 20px 80px}
    .detail-grid{display:grid;grid-template-columns:1fr 340px;gap:40px}
    .detail-main h2{font-family:'Playfair Display',serif;font-size:1.4rem;margin:28px 0 12px;display:flex;align-items:center;gap:8px}
    .detail-main p{color:var(--muted);line-height:1.8;font-size:.92rem;margin:0 0 14px}
    .info-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:14px}
    .info-card h3{font-size:.95rem;margin:0 0 12px;display:flex;align-items:center;gap:8px}
    .info-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:.86rem}
    .info-row:last-child{border:none}
    .info-row .label{color:var(--muted)}
    .info-row .value{font-weight:600;text-align:right;max-width:60%}
    .tag-list{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}
    .tag{background:var(--mint);color:var(--forest);padding:6px 14px;border-radius:999px;font-size:.82rem;font-weight:600}
    .tag-blue{background:#e8f4f8;color:#1a6fb5}
    .tag-gold{background:#fff8e1;color:#9a6716}
    .tip-box{background:#fffbf0;border-left:3px solid var(--gold);border-radius:0 10px 10px 0;padding:14px 18px;margin:14px 0;font-size:.88rem;line-height:1.7}
    .safety-box{background:#fff0f0;border-left:3px solid #d94a4a;border-radius:0 10px 10px 0;padding:14px 18px;margin:14px 0;font-size:.88rem;line-height:1.7}
    .access-box{background:#f0f7ff;border-left:3px solid #3b82f6;border-radius:0 10px 10px 0;padding:14px 18px;margin:14px 0;font-size:.88rem;line-height:1.7}
    .gallery-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
    .gallery-grid img{width:100%;height:140px;object-fit:cover;border-radius:10px;cursor:pointer;transition:.25s}
    .gallery-grid img:hover{transform:scale(1.03)}
    .nearby-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.88rem}
    .nearby-item:last-child{border:none}
    .nearby-item .dist{color:var(--muted);font-size:.82rem;margin-left:auto}
    .facility-chips{display:flex;flex-wrap:wrap;gap:8px}
    .facility-chip{display:flex;align-items:center;gap:6px;padding:6px 12px;background:var(--mint);color:var(--forest);border-radius:999px;font-size:.8rem;font-weight:600}
    .restaurant-card{display:flex;align-items:center;gap:14px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
    .restaurant-card .r-icon{width:44px;height:44px;border-radius:10px;background:var(--mint);display:flex;align-items:center;justify-content:center;font-size:1.2rem;color:var(--forest)}
    .restaurant-card .r-info{flex:1}
    .restaurant-card .r-info b{display:block;font-size:.9rem}
    .restaurant-card .r-info small{color:var(--muted);font-size:.8rem}
    .restaurant-card .r-price{font-weight:700;font-size:.88rem;color:var(--forest)}
    .hotel-mini{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
    .hotel-mini .h-info{flex:1}
    .hotel-mini .h-info b{display:block;font-size:.88rem}
    .hotel-mini .h-info small{color:var(--muted);font-size:.78rem}
    .hotel-mini .h-rating{color:var(--gold);font-size:.82rem;font-weight:700}
    .hotel-mini .h-price{font-size:.82rem;font-weight:600;color:var(--forest)}
    .hotel-mini .h-dist{font-size:.75rem;color:var(--muted)}
    .guide-card-detail{display:flex;gap:14px;align-items:center;background:var(--mint);border-radius:12px;padding:14px;margin-bottom:10px}
    .guide-card-detail img{width:48px;height:48px;border-radius:50%;object-fit:cover}
    .guide-card-detail .ginfo b{display:block;font-size:.9rem}
    .guide-card-detail .ginfo small{color:var(--muted);font-size:.82rem}
    .coord-badge{display:inline-flex;align-items:center;gap:6px;background:#f4f7f6;padding:6px 14px;border-radius:999px;font-size:.82rem;color:var(--muted)}
    .map-link{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:var(--forest);color:#fff;border-radius:10px;text-decoration:none;font-size:.85rem;font-weight:600;transition:.2s}
    .map-link:hover{opacity:.9}
    @media(max-width:800px){.detail-grid{grid-template-columns:1fr}.detail-hero{height:40vh;min-height:280px}.detail-hero h1{font-size:1.8rem}.gallery-grid{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
<nav class="site-nav"><div class="shell nav-inner"><a class="brand" href="index.html"><b class="brand-mark">C</b>ComfyGo</a><div class="nav-links" id="navLinks"><a href="index.html">Explore</a><a href="hotels.html">Hotels</a><a class="active" href="destinations.html">Destinations</a><a href="packages.html">Packages</a><a href="activities.html">Activities</a><a href="guides.html">Guides</a><a href="flights.html">Flights</a></div><div class="nav-actions"><a href="login.html">Log in</a><a class="btn btn-ghost" href="register.html">Sign up</a></div><button class="menu-toggle" data-menu><i class="bi bi-list"></i></button></div></nav>

<div id="detail-root"><div class="shell section" style="min-height:500px"><p class="muted">Loading destination…</p></div></div>

<footer class="footer"><div class="shell"><div class="footer-grid"><div><a class="brand" href="index.html"><b class="brand-mark">C</b>ComfyGo</a><p>Thoughtful stays and real local experiences.</p></div><div><h4>Explore</h4><a href="hotels.html">Hotels</a><a href="packages.html">Packages</a><a href="destinations.html">Destinations</a><a href="activities.html">Activities</a></div><div><h4>Support</h4><a href="#">Help</a><a href="#">Privacy</a><a href="#">Terms</a></div></div><div class="footer-bottom">© 2026 ComfyGo.</div></div></footer>

<script src="js/utils/storage.js?v=7"></script>
<script src="js/api/client.js?v=7"></script>
<script src="js/ui.js?v=7"></script>
<script>
const guidePortraits=['https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=100&q=85','https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&q=85','https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=100&q=85','https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=100&q=85','https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=100&q=85','https://images.unsplash.com/photo-1438761681033-6461ffad8d80?auto=format&fit=crop&w=100&q=85'];
const countryFlags={'Sri Lanka':'<i class="bi bi-geo-alt"></i>','Bangladesh':'<i class="bi bi-geo-alt"></i>','Nepal':'<i class="bi bi-geo-alt"></i>','Thailand':'<i class="bi bi-geo-alt"></i>','India':'<i class="bi bi-geo-alt"></i>'};
const catColors={'Historical':'#9a6716','Beach':'#1a6fb5','Mountain':'#6b3fa0','Nature':'#177457','Cultural':'#a63b20','Adventure':'#c05621','Wildlife':'#2d7d46'};
function escapeHtml(t){const d=document.createElement('div');d.textContent=t||'';return d.innerHTML}
function parseJson(s){try{return JSON.parse(s)}catch{return[]}}
function facilityIcon(f){const l=f.toLowerCase();if(l.includes('parking'))return'bi-p-circle';if(l.includes('restroom')||l.includes('toilet'))return'bi-droplet';if(l.includes('café')||l.includes('cafe'))return'bi-cup-hot';if(l.includes('shop'))return'bi-bag';if(l.includes('atm'))return'bi-credit-card';if(l.includes('guide'))return'bi-compass';if(l.includes('museum'))return'bi-building';if(l.includes('lifeguard'))return'bi-shield-check';if(l.includes('umbrella')||l.includes('beach'))return'bi-sun';if(l.includes('rental'))return'bi-tools';if(l.includes('restaurant'))return'bi-utensils';if(l.includes('gym'))return'bi-bicycle';return'bi-check2-circle'}

document.addEventListener('DOMContentLoaded',async()=>{
  const root=document.getElementById('detail-root');
  const params=new URLSearchParams(window.location.search);
  const spotId=params.get('id');
  if(!spotId){root.innerHTML='<div class="shell section"><p class="muted">No destination selected. <a href="destinations.html">Browse all destinations</a></p></div>';return}

  try{
    const spot=await apiClient.get('/tourist-spots/'+spotId);
    const guidesData=await apiClient.get('/guides/?limit=50');
    const allGuides=(guidesData.items||[]).filter(g=>g.guide_city===spot.spot_city);
    const galleries=parseJson(spot.spot_gallery_images);
    const attractions=parseJson(spot.spot_attractions);
    const activities=parseJson(spot.spot_activities);
    const nearby=parseJson(spot.spot_nearby);
    const facilities=parseJson(spot.spot_facilities);
    const restaurants=parseJson(spot.spot_nearby_restaurants);
    const hotels=parseJson(spot.spot_nearby_hotels);
    const thingsToDo=parseJson(spot.spot_things_to_do);
    const catColor=catColors[spot.spot_category]||'#177457';
    const flag=countryFlags[spot.spot_country]||'';
    const stars=spot.spot_rating?'<i class="bi bi-star-fill"></i>'.repeat(spot.spot_rating)+'<i class="bi bi-star"></i>'.repeat(5-spot.spot_rating):'';

    root.innerHTML=`
      <header class="detail-hero">
        <img src="${escapeHtml(spot.spot_hero_image||galleries[0]||'https://images.unsplash.com/photo-1506929562872-bb421503ef21?auto=format&fit=crop&w=1200&q=85')}" alt="${escapeHtml(spot.spot_name)}">
        <div class="detail-hero-content"><div class="shell">
          <span class="detail-category" style="background:${catColor}">${escapeHtml(spot.spot_type||spot.spot_category)}</span>
          <h1>${flag} ${escapeHtml(spot.spot_name)}</h1>
          <div class="hero-meta">
            <span><i class="bi bi-geo-alt"></i> ${escapeHtml(spot.spot_city)}, ${escapeHtml(spot.spot_country)}</span>
            <span style="color:#ffbd95">${stars} ${spot.spot_rating||''} ${spot.spot_review_count?`(${spot.spot_review_count.toLocaleString()} reviews)`:''}</span>
            ${spot.spot_latitude?`<span class="coord-badge"><i class="bi bi-pin-map"></i> ${spot.spot_latitude}°, ${spot.spot_longitude}°</span>`:''}
          </div>
        </div></div>
      </header>

      <div class="detail-body">
        <div class="detail-grid">
          <div class="detail-main">
            <h2><i class="bi bi-info-circle"></i> About</h2>
            <p>${escapeHtml(spot.spot_detailed_description||spot.spot_description||'A wonderful destination waiting to be explored.')}</p>

            ${galleries.length?`
              <h2><i class="bi bi-images"></i> Gallery</h2>
              <div class="gallery-grid">${galleries.map((url,i)=>`<img src="${escapeHtml(url)}" alt="Photo ${i+1}" loading="lazy" onerror="this.style.display='none'">`).join('')}</div>
            `:''}

            ${thingsToDo.length?`
              <h2><i class="bi bi-lightning"></i> Things to Do</h2>
              <div class="tag-list">${thingsToDo.map(t=>`<span class="tag tag-blue"><i class="bi bi-check2-circle"></i> ${escapeHtml(t)}</span>`).join('')}</div>
            `:''}

            ${attractions.length?`
              <h2><i class="bi bi-star"></i> Top Attractions</h2>
              <div class="tag-list">${attractions.map(a=>`<span class="tag"><i class="bi bi-pin-angle"></i> ${escapeHtml(a)}</span>`).join('')}</div>
            `:''}

            ${activities.length?`
              <h2><i class="bi bi-compass"></i> Activities</h2>
              <div class="tag-list">${activities.map(a=>`<span class="tag tag-gold"><i class="bi bi-play-circle"></i> ${escapeHtml(a)}</span>`).join('')}</div>
            `:''}

            ${restaurants.length?`
              <h2><i class="bi bi-utensils"></i> Nearby Restaurants</h2>
              ${restaurants.map(r=>`
                <div class="restaurant-card">
                  <div class="r-icon"><i class="bi bi-cup-hot"></i></div>
                  <div class="r-info"><b>${escapeHtml(r.name)}</b><small>${escapeHtml(r.cuisine||'')}</small></div>
                  <span class="r-price">${escapeHtml(r.price||'')}</span>
                </div>
              `).join('')}
            `:''}

            ${nearby.length?`
              <h2><i class="bi bi-signpost"></i> Nearby Places</h2>
              ${nearby.map(n=>`<div class="nearby-item"><i class="bi bi-geo-alt" style="color:var(--forest)"></i><span>${escapeHtml(n.name)}</span><span class="dist">${escapeHtml(n.distance)}</span></div>`).join('')}
            `:''}

            ${spot.spot_travel_tips?`
              <h2><i class="bi bi-lightbulb"></i> Travel Tips</h2>
              <div class="tip-box"><i class="bi bi-info-circle"></i> ${escapeHtml(spot.spot_travel_tips)}</div>
            `:''}

            ${spot.spot_safety_info?`
              <h2><i class="bi bi-shield-check"></i> Safety</h2>
              <div class="safety-box"><i class="bi bi-exclamation-triangle"></i> ${escapeHtml(spot.spot_safety_info)}</div>
            `:''}

            ${spot.spot_accessibility?`
              <h2><i class="bi bi-universal-access"></i> Accessibility</h2>
              <div class="access-box"><i class="bi bi-person-wheelchair"></i> ${escapeHtml(spot.spot_accessibility)}</div>
            `:''}

            ${spot.spot_transport_info?`
              <h2><i class="bi bi-bus-front"></i> Getting There</h2>
              <p>${escapeHtml(spot.spot_transport_info)}</p>
            `:''}

            ${spot.spot_latitude?`
              <h2><i class="bi bi-map"></i> Location</h2>
              <a class="map-link" href="https://www.google.com/maps?q=${spot.spot_latitude},${spot.spot_longitude}" target="_blank"><i class="bi bi-box-arrow-up-right"></i> Open in Google Maps</a>
            `:''}
          </div>

          <aside>
            <!-- Quick Facts -->
            <div class="info-card">
              <h3><i class="bi bi-clipboard-data"></i> Quick Facts</h3>
              ${spot.spot_opening_hours?`<div class="info-row"><span class="label"><i class="bi bi-clock"></i> Hours</span><span class="value">${escapeHtml(spot.spot_opening_hours)}</span></div>`:''}
              ${spot.spot_entry_fee?`<div class="info-row"><span class="label"><i class="bi bi-ticket"></i> Entry Fee</span><span class="value">${escapeHtml(spot.spot_entry_fee)}</span></div>`:''}
              ${spot.spot_duration?`<div class="info-row"><span class="label"><i class="bi bi-hourglass-split"></i> Duration</span><span class="value">${escapeHtml(spot.spot_duration)}</span></div>`:''}
              <div class="info-row"><span class="label"><i class="bi bi-calendar3"></i> Best Time</span><span class="value">${escapeHtml(spot.spot_best_time||'Year-round')}</span></div>
              ${spot.spot_budget_daily?`<div class="info-row"><span class="label"><i class="bi bi-wallet2"></i> Budget</span><span class="value">${escapeHtml(spot.spot_budget_daily)}</span></div>`:''}
              ${spot.spot_currency?`<div class="info-row"><span class="label"><i class="bi bi-cash-stack"></i> Currency</span><span class="value">${escapeHtml(spot.spot_currency)}</span></div>`:''}
              ${spot.spot_language?`<div class="info-row"><span class="label"><i class="bi bi-translate"></i> Language</span><span class="value">${escapeHtml(spot.spot_language)}</span></div>`:''}
              ${spot.spot_timezone?`<div class="info-row"><span class="label"><i class="bi bi-globe2"></i> Timezone</span><span class="value">${escapeHtml(spot.spot_timezone)}</span></div>`:''}
            </div>

            <!-- Facilities -->
            ${facilities.length?`
              <div class="info-card">
                <h3><i class="bi bi-grid-3x3-gap"></i> Facilities</h3>
                <div class="facility-chips">${facilities.map(f=>`<span class="facility-chip"><i class="bi ${facilityIcon(f)}"></i> ${escapeHtml(f)}</span>`).join('')}</div>
              </div>
            `:''}

            <!-- Weather -->
            ${spot.spot_weather?`
              <div class="info-card">
                <h3><i class="bi bi-cloud-sun"></i> Weather</h3>
                <p style="margin:0;font-size:.86rem;color:var(--muted);line-height:1.7">${escapeHtml(spot.spot_weather)}</p>
              </div>
            `:''}

            <!-- Nearby Hotels -->
            ${hotels.length?`
              <div class="info-card">
                <h3><i class="bi bi-buildings"></i> Nearby Hotels</h3>
                ${hotels.map(h=>`
                  <div class="hotel-mini">
                    <div class="h-info">
                      <b>${escapeHtml(h.name)}</b>
                      <small>${'<i class="bi bi-star-fill" style="color:var(--gold)"></i>'.repeat(h.rating||0)} ${h.rating?h.rating+' star':''}</small>
                    </div>
                    <div style="text-align:right">
                      <span class="h-price">${escapeHtml(h.price||'')}</span><br>
                      <span class="h-dist">${escapeHtml(h.distance||'')}</span>
                    </div>
                  </div>
                `).join('')}
                <a class="btn btn-ghost" href="hotels.html?city=${encodeURIComponent(spot.spot_city)}" style="width:100%;justify-content:center;margin-top:8px;font-size:.85rem">Find more hotels</a>
              </div>
            `:''}

            <!-- Local Guides -->
            ${allGuides.length?`
              <div class="info-card" style="background:var(--mint);border-color:var(--mint)">
                <h3><i class="bi bi-compass"></i> Local Guides</h3>
                ${allGuides.slice(0,4).map((g,i)=>`
                  <div class="guide-card-detail">
                    <img src="${guidePortraits[i%guidePortraits.length]}" alt="${escapeHtml(g.guide_name)}">
                    <div class="ginfo">
                      <b>${escapeHtml(g.guide_name)}</b>
                      <small><i class="bi bi-translate"></i> ${escapeHtml(g.guide_language||'English')}</small>
                      <small>${g.guide_experience||0} years exp.</small>
                    </div>
                  </div>
                `).join('')}
                <a class="btn btn-ghost" href="guides.html" style="width:100%;justify-content:center;margin-top:8px;font-size:.85rem">View all guides</a>
              </div>
            `:`
              <div class="info-card" style="background:var(--mint);border-color:var(--mint)">
                <h3><i class="bi bi-compass"></i> Local Guides</h3>
                <p style="margin:0;font-size:.85rem;color:var(--muted)">No guides available for ${escapeHtml(spot.spot_city)} yet.</p>
              </div>
            `}

            <!-- CTA -->
            <div style="margin-top:14px;display:flex;flex-direction:column;gap:8px">
              <a class="btn btn-primary" href="hotels.html?city=${encodeURIComponent(spot.spot_city)}" style="width:100%;justify-content:center"><i class="bi bi-buildings"></i> Hotels in ${escapeHtml(spot.spot_city)}</a>
              <a class="btn btn-ghost" href="packages.html" style="width:100%;justify-content:center"><i class="bi bi-map"></i> Tour packages</a>
            </div>
          </aside>
        </div>
      </div>
    `;
    document.title=spot.spot_name+' · ComfyGo';
  }catch(error){
    root.innerHTML=`<div class="shell section" style="text-align:center;padding:100px 20px"><i class="bi bi-geo-alt" style="font-size:3rem;color:var(--muted)"></i><h2 style="margin:20px 0 10px">Destination not found</h2><p class="muted">This destination may have been removed or the link is invalid.</p><a class="btn btn-primary" href="destinations.html" style="margin-top:20px">Browse all destinations</a></div>`;
  }
});
</script>
</body>
</html>
