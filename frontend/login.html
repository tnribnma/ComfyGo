<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Welcome back · ComfyGo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="auth-page">
  <aside class="auth-aside">
    <a class="brand" href="index.html"><b class="brand-mark">C</b>ComfyGo</a>
    <div class="auth-aside-copy">
      <span class="eyebrow" style="color:#ffc09d">YOUR NEXT ESCAPE</span>
      <h1>Come back to a world of good stays.</h1>
      <p>Pick up where you left off: save places, manage bookings and discover your next favourite destination.</p>
    </div>
  </aside>
  <section class="auth-main">
    <div class="auth-card">
      <a class="brand" href="index.html"><b class="brand-mark">C</b>ComfyGo</a>
      <h1>Welcome back</h1>
      <p>Sign in to manage your travel plans.</p>
      <div id="auth-message" class="form-message"></div>
      <form class="auth-form" data-login>
        <label>Email address
          <input required name="email" type="email" autocomplete="email" placeholder="you@example.com">
        </label>
        <label>Password
          <input required name="password" type="password" autocomplete="current-password" placeholder="Enter your password">
        </label>
        <label>Sign in as
          <select name="role">
            <option value="customer">Customer</option>
            <option value="admin">Admin</option>
            <option value="employee">Employee</option>
          </select>
        </label>
        <div class="auth-row">
          <label style="font-weight:500;display:flex;align-items:center;gap:7px">
            <input style="width:auto;margin:0" type="checkbox"> Remember me
          </label>
          <a href="register.html">Need an account?</a>
        </div>
        <button type="submit" class="btn btn-primary">Sign in <i class="bi bi-arrow-right"></i></button>
      </form>
      <p class="auth-switch">New to ComfyGo? <a href="register.html">Create your account</a></p>
      <a class="btn btn-ghost" style="width:100%" href="index.html"><i class="bi bi-arrow-left"></i> Back to home</a>
    </div>
  </section>
</main>
<script src="js/utils/storage.js?v=5"></script>
<script src="js/api/client.js?v=5"></script>
<script src="js/auth-ui.js?v=5"></script>
</body>
</html>
