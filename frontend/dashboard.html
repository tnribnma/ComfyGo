<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - ComfyGo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html">ComfyGo Admin</a>
            <div class="d-flex">
                <a href="hotels.html" class="btn btn-outline-light btn-sm me-2">Manage Hotels</a>
                <button id="logout-btn" class="btn btn-danger btn-sm">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>System Overview</h2>
        <hr>
        
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card text-white bg-primary">
                    <div class="card-body">
                        <h5 class="card-title">Customers</h5>
                        <h2 id="stat-customers">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-success">
                    <div class="card-body">
                        <h5 class="card-title">Hotels</h5>
                        <h2 id="stat-hotels">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-warning">
                    <div class="card-body">
                        <h5 class="card-title">Bookings</h5>
                        <h2 id="stat-bookings">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-info">
                    <div class="card-body">
                        <h5 class="card-title">Payments</h5>
                        <h2 id="stat-payments">0</h2>
                    </div>
                </div>
            </div>
        </div>

        <h4>Recent System Activity</h4>
        <div id="activity-feed" class="list-group">
        </div>
    </div>

    <script src="js/utils/storage.js"></script>
    <script src="js/api/client.js"></script>
    <script src="js/modules/auth.js"></script>
    <script src="js/modules/dashboard.js"></script>
</body>
</html>
